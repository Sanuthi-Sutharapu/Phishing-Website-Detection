<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hook or Not</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1140;--sun:#ffd23f;--coral:#ff5a5f;--mint:#2fd6a0;--grape:#8a4dff;--pink:#ff8fc7;--muted:#5b5680;--line:#e6e0fa;--good:#0a9b6b;--warn:#c26400;--bad:#d62f4f}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font:400 18px/1.5 Nunito,system-ui,sans-serif;background:linear-gradient(#8fe0ff,#3fb8ff 45%,#2a7de1 100%) fixed;padding:36px 20px 150px;overflow-x:hidden}
main{max-width:780px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mascot{width:136px;flex:none;transition:transform .3s}.mascot:hover{transform:rotate(-8deg) scale(1.1)}
h1{font:700 clamp(2.8rem,10vw,5.2rem)/.95 Fredoka,sans-serif;margin:0;color:#fff;letter-spacing:.01em;text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.tag{display:inline-block;font:600 1.3rem Fredoka,sans-serif;margin:16px 0 26px;background:var(--sun);padding:6px 18px;border:3px solid var(--ink);border-radius:99px;transform:rotate(-1.5deg);box-shadow:3px 3px 0 var(--ink)}
.tabs{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap}
button{font:600 1rem Fredoka,sans-serif;color:var(--ink);cursor:pointer;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:0 22px;transition:transform .1s,box-shadow .1s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.tab{padding:10px 22px;font-size:1.05rem}.tab.on{background:var(--pink)}
form{display:flex;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px;box-shadow:6px 6px 0 var(--ink)}
input{flex:1;min-width:0;border:0;background:none;padding:14px 12px;font:600 1rem "JetBrains Mono",monospace;color:var(--ink)}
input:focus{outline:none}
form button{background:var(--coral);color:#fff;font-size:1.1rem}
.try{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 0;align-items:center;font:600 1.05rem Fredoka,sans-serif;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.try button{padding:6px 14px;font-size:.95rem;box-shadow:0 3px 0 var(--ink);text-shadow:none}
.try button:nth-of-type(1){background:var(--mint)}.try button:nth-of-type(2){background:var(--sun)}.try button:nth-of-type(3){background:var(--pink)}
#result{margin-top:40px}
.card{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:26px;box-shadow:8px 8px 0 var(--ink);animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(16px) rotate(1deg)}}
@keyframes shake{25%{transform:translateX(-10px) rotate(-1deg)}75%{transform:translateX(10px) rotate(1deg)}}
@keyframes pop{40%{transform:scale(1.035) rotate(-.6deg)}}
.shake{animation:shake .35s}.pop{animation:pop .3s}
.head{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:2.1rem;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.verdict{font:700 clamp(1.8rem,5vw,2.5rem)/1.05 Fredoka,sans-serif;margin:0}
.legitimate .badge{background:var(--mint)}.legitimate .verdict{color:var(--good)}
.suspicious .badge{background:var(--sun)}.suspicious .verdict{color:var(--warn)}
.phishing .badge{background:var(--coral)}.phishing .verdict{color:var(--bad)}
.anat{margin:18px 0 6px;padding:16px;border:3px dashed var(--grape);border-radius:14px;background:#f6f2ff;font:600 1rem/2 "JetBrains Mono",monospace;word-break:break-all}
.anat .m{color:var(--muted)}
.anat .d{background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:2px 7px;font-weight:700}
.msg{margin:16px 0 4px;padding:12px 16px;background:var(--mint);border:3px solid var(--ink);border-radius:20px 20px 20px 4px;font-weight:700;max-width:88%}
.real{margin:0 0 18px;color:var(--muted);font-size:1rem}.real b{color:var(--ink)}
.meter{height:18px;border-radius:9px;border:3px solid var(--ink);position:relative;background:linear-gradient(90deg,var(--mint) 0 50%,var(--sun) 50% 84%,var(--coral) 84%)}
.meter i{position:absolute;top:-9px;width:8px;height:32px;background:var(--ink);border:2px solid #fff;border-radius:5px;transform:translateX(-4px);transition:left .8s cubic-bezier(.3,1.5,.5,1)}
.scale{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-weight:700;font-size:.9rem}
h2{font:700 1.4rem Fredoka,sans-serif;margin:26px 0 6px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;padding:12px 0;border-top:2px dotted var(--line)}
li:before{content:"";flex:none;width:14px;height:14px;border-radius:50%;margin-top:6px;border:2px solid var(--ink);background:var(--line)}
li.high:before{background:var(--coral)}li.medium:before{background:var(--sun)}li.good:before{background:var(--mint)}
.gbar{display:flex;justify-content:space-between;gap:8px;font:600 1rem Fredoka,sans-serif;color:var(--muted)}.gbar b{color:var(--ink)}
.gq{font:700 1.8rem/1.1 Fredoka,sans-serif;margin:16px 0 0}
.choices{display:flex;gap:14px;margin-top:20px}
.choices button{flex:1;padding:18px;font-size:1.25rem;color:#fff}
.ok{background:var(--mint)!important;color:var(--ink)!important}.no{background:var(--coral)!important}
.next{margin-top:18px;padding:14px 28px;background:var(--sun)}
.rank{font:700 clamp(2.2rem,8vw,3.4rem)/1 Fredoka,sans-serif;margin:8px 0 12px;color:var(--grape)}
.note{margin-top:36px;max-width:62ch;color:#fff;font-weight:600;font-size:.92rem;text-shadow:1px 1px 0 var(--ink)}
.err{background:#fff;color:var(--bad);border:3px solid var(--ink);border-radius:14px;padding:14px 18px;font-weight:700}
.bub{position:fixed;bottom:-50px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.75);animation:up linear infinite;z-index:0}
@keyframes up{to{transform:translateY(-120vh)}}
.wave{position:fixed;left:0;bottom:0;width:100%;height:120px;z-index:0}
.confetti{position:fixed;top:-30px;font-size:1.7rem;pointer-events:none;z-index:9;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:520px){form{flex-direction:column}form button{padding:14px}.card{padding:18px}.mascot{width:84px}.choices{flex-direction:column}}
@media (prefers-reduced-motion:reduce){.card,.shake,.pop,.bub{animation:none}.confetti{display:none}.meter i{transition:none}}
@media (max-width:1200px){}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="cat" viewBox="0 0 100 90">
<path d="M80 72Q106 64 94 38" fill="none" stroke="#1b1140" stroke-width="12" stroke-linecap="round"/>
<path d="M80 72Q106 64 94 38" fill="none" style="stroke:var(--c)" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="50" cy="70" rx="32" ry="19" style="fill:var(--c)" stroke="#1b1140" stroke-width="4"/>
<path d="M27 26L29 5L46 17ZM73 26L71 5L54 17Z" style="fill:var(--c)" stroke="#1b1140" stroke-width="4" stroke-linejoin="round"/>
<path d="M32 21L33 11L41 17ZM68 21L67 11L59 17Z" fill="#ff8fc7"/>
<circle cx="50" cy="42" r="27" style="fill:var(--c)" stroke="#1b1140" stroke-width="4"/>
<ellipse cx="40" cy="41" rx="3.5" ry="5" fill="#1b1140"/><ellipse cx="60" cy="41" rx="3.5" ry="5" fill="#1b1140"/>
<circle cx="41.3" cy="39" r="1.3" fill="#fff"/><circle cx="61.3" cy="39" r="1.3" fill="#fff"/>
<path d="M47 49H53L50 53Z" fill="#ff8fc7" stroke="#1b1140" stroke-width="2" stroke-linejoin="round"/>
<path d="M50 53Q45 59 41 55M50 53Q55 59 59 55" fill="none" stroke="#1b1140" stroke-width="2.5" stroke-linecap="round"/>
<path d="M30 50L13 46M30 55L13 57M70 50L87 46M70 55L87 57" stroke="#1b1140" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="33" cy="52" r="5" fill="#ff8fc7" opacity=".5"/><circle cx="67" cy="52" r="5" fill="#ff8fc7" opacity=".5"/>
</symbol></defs></svg>
<span class="bub" style="left:6%;width:24px;height:24px;animation-duration:16s;animation-delay:-2s"></span><span class="bub" style="left:22%;width:14px;height:14px;animation-duration:12s;animation-delay:-7s"></span><span class="bub" style="left:41%;width:30px;height:30px;animation-duration:19s;animation-delay:-4s"></span><span class="bub" style="left:63%;width:18px;height:18px;animation-duration:14s;animation-delay:-9s"></span><span class="bub" style="left:80%;width:26px;height:26px;animation-duration:17s;animation-delay:-1s"></span><span class="bub" style="left:93%;width:12px;height:12px;animation-duration:11s;animation-delay:-6s"></span><svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 50Q90 10 180 50T360 50T540 50T720 50T900 50T1080 50T1260 50T1440 50V120H0Z" fill="#1f5fc4" opacity=".55"/><path d="M0 80Q120 40 240 80T480 80T720 80T960 80T1200 80T1440 80V120H0Z" fill="#173f96"/></svg>
<main>

  <div class="brand"><svg class="mascot" viewBox="0 0 160 150" aria-hidden="true">
<path d="M26 150Q26 116 70 116Q114 116 114 150Z" fill="#2fd6a0" stroke="#1b1140" stroke-width="4" stroke-linejoin="round"/>
<g fill="#5b3a29" stroke="#1b1140" stroke-width="4">
<circle cx="70" cy="26" r="20"/><circle cx="98" cy="34" r="19"/><circle cx="116" cy="58" r="19"/><circle cx="118" cy="88" r="18"/>
<circle cx="42" cy="34" r="19"/><circle cx="24" cy="58" r="19"/><circle cx="22" cy="88" r="18"/>
<circle cx="30" cy="112" r="14"/><circle cx="110" cy="112" r="14"/></g>
<circle cx="70" cy="76" r="36" fill="#e0a370" stroke="#1b1140" stroke-width="4"/>
<g fill="#5b3a29" stroke="#1b1140" stroke-width="3"><circle cx="48" cy="50" r="10"/><circle cx="70" cy="44" r="11"/><circle cx="92" cy="50" r="10"/></g>
<ellipse cx="56" cy="78" rx="4" ry="5.5" fill="#1b1140"/><ellipse cx="84" cy="78" rx="4" ry="5.5" fill="#1b1140"/>
<circle cx="57.3" cy="76" r="1.5" fill="#fff"/><circle cx="85.3" cy="76" r="1.5" fill="#fff"/>
<circle cx="47" cy="91" r="6" fill="#ff8fc7" opacity=".6"/><circle cx="93" cy="91" r="6" fill="#ff8fc7" opacity=".6"/>
<path d="M58 94Q70 106 82 94" fill="none" stroke="#1b1140" stroke-width="3.5" stroke-linecap="round"/>
<g stroke="#1b1140" stroke-width="3"><circle cx="91" cy="21" r="8" fill="#ff8fc7"/><circle cx="109" cy="21" r="8" fill="#ff8fc7"/><circle cx="100" cy="21" r="5" fill="#ff5a5f"/></g>
<use href="#cat" x="88" y="84" width="72" height="65" style="--c:#ff9f43"/><path d="M34 132Q70 150 118 134" fill="none" stroke="#1b1140" stroke-width="16" stroke-linecap="round"/><path d="M34 132Q70 150 118 134" fill="none" stroke="#2fd6a0" stroke-width="9" stroke-linecap="round"/><circle cx="124" cy="132" r="8" fill="#e0a370" stroke="#1b1140" stroke-width="3.5"/></svg><h1>Hook or Not</h1></div>
  <p class="tag">Catch the phish before it catches you!</p>
  <div class="tabs"><button class="tab on" data-t="scan">Scan a link</button><button class="tab" data-t="game">Spot the phish</button></div>

  <section id="scan">
    <form id="f">
      <input id="u" type="text" placeholder="paste a link here" aria-label="Web address to check" autocomplete="off" spellcheck="false" required>
      <button id="b" type="submit">Check link</button>
    </form>
    
    <div id="result" aria-live="polite"></div>
  </section>

  <section id="game" hidden><div id="gbox" aria-live="polite"></div></section>

</main>
<script>
const $ = id => document.getElementById(id);
const TITLES = {legitimate:"Looks legitimate", suspicious:"Suspicious", phishing:"Likely phishing"};
const EMO = {legitimate:"✅", suspicious:"🤔", phishing:"🎣"};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const post = (url, modelOnly) => fetch("/api/check", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({url, model_only: !!modelOnly})}).then(async r => ({ok:r.ok, d:await r.json()}));
const anatomy = p => `<span class="m">${esc(p.scheme + p.subdomain)}</span><span class="d">${esc(p.domain)}</span><span class="m">${esc(p.rest)}</span>`;
const reasonList = rs => `<ul>${rs.map(r => `<li class="${r.level}">${esc(r.text)}</li>`).join("")}</ul>`;

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  $("scan").hidden = t.dataset.t !== "scan"; $("game").hidden = t.dataset.t !== "game";
  if (t.dataset.t === "game" && !$("gbox").innerHTML) intro();
}));

/* ---------- Scanner ---------- */
document.querySelectorAll(".try button").forEach(b => b.addEventListener("click", () => { $("u").value = b.dataset.u; $("f").requestSubmit(); }));
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("b"), out = $("result");
  btn.disabled = true; btn.textContent = "Checking...";
  try {
    const {ok, d} = await post($("u").value);
    if (!ok) { out.innerHTML = `<p class="err">${esc(d.error || "Something went wrong.")}</p>`; return; }
    const p = d.parts;
    out.innerHTML = `<div class="card ${d.verdict}">
      <div class="head"><div class="badge">${EMO[d.verdict]}</div><p class="verdict">${TITLES[d.verdict]}</p></div>
      ${p ? `<div class="anat">${anatomy(p)}</div><p class="real">The site you would actually visit is <b>${esc(p.domain)}</b>.${d.assumed_https ? " No scheme was entered, so https was assumed." : ""}</p>` : ""}
      <div class="meter"><i style="left:0"></i></div>
      <div class="scale"><span>Low risk</span><span>Risk score ${d.score} / 100</span><span>High risk</span></div>
      <h2>Why</h2>${reasonList(d.reasons)}</div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => out.querySelector(".meter i").style.left = d.score + "%"));
  } catch (err) {
    out.innerHTML = `<p class="err">Could not reach the local server. Is python app/server.py still running?</p>`;
  } finally { btn.disabled = false; btn.textContent = "Check link"; }
});

/* ---------- Game: Spot the phish (1 = phishing, made-up examples, never opened) ---------- */
const CONTEXTS = ["A message says you must act today:", "Someone shared this in a group chat:", "It arrived in an email:",
"You found it in a text message:", "A pop-up urged you to click:", "It was in a QR code you scanned:", "A stranger's reply to your post:", "It showed up in your spam folder:"];
const pick = a => a[Math.floor(Math.random() * a.length)];
const defang = s => s.replace(/^http/i, "hxxp");
const ROUNDS = 8;
let g;
const RANKS = [[400,"Minnow"],[800,"Hook dodger"],[1200,"Phish hunter"],[9999,"Sea legend"]];

function intro() {
  $("gbox").innerHTML = `<div class="card"><p class="gq">Real or fake?</p>
    <p>${ROUNDS} rounds to test your Knowledge🤭.Judge the link, not the message. Will you be able to beat the detector?.Let's see if you WIN😼!</p>
    <button class="next" id="go">Start game</button></div>`;
  $("go").onclick = start;
}
async function start() {
  $("gbox").innerHTML = `<div class="card"><p class="gq">Fishing up ${ROUNDS} fresh links...</p></div>`;
  try {
    const res = await fetch("/api/game"), d = await res.json();
    if (!res.ok) { $("gbox").innerHTML = `<p class="err">${esc(d.error)}</p>`; return; }
    g = {list: d.items.map(it => [it.url, it.phishing ? 1 : 0, pick(CONTEXTS)]), i:0, score:0, streak:0, you:0, ai:0};
    round();
  } catch (e) { $("gbox").innerHTML = `<p class="err">Could not reach the local server. Is python app/server.py running?</p>`; }
}
function round() {
  const [url,, ctx] = g.list[g.i];
  $("gbox").innerHTML = `<div class="card" id="rc">
    <div class="gbar"><span>Link ${g.i + 1} of ${ROUNDS}</span><span>Score <b>${g.score}</b></span><span>Streak <b>${g.streak}</b></span></div>
    <p class="gq">Would you click this?</p><div class="msg">${esc(ctx)}</div><div class="anat" id="ga">${esc(defang(url))}</div>
    <div class="choices"><button class="ok" data-a="0">Looks real</button><button class="no" data-a="1">Looks fake</button></div></div>`;
  document.querySelectorAll(".choices button").forEach(b => b.onclick = () => guess(+b.dataset.a));
}
async function guess(a) {
  const [url, truth] = g.list[g.i], rc = $("rc");
  rc.querySelector(".choices").innerHTML = `<p class="real">Asking the detector...</p>`;
  const right = a === truth, pts = right ? 100 + 25 * Math.min(g.streak, 4) : 0;
  g.score += pts; g.streak = right ? g.streak + 1 : 0; g.you += right;
  let ai = null;
  try { const r = await post(url, true); if (r.ok) ai = r.d; } catch (e) {}
  const aiRight = ai && ((ai.verdict !== "legitimate") === !!truth);
  g.ai += aiRight ? 1 : 0;
  rc.classList.add(right ? "pop" : "shake"); if (right) confetti();
  if (ai && ai.parts) $("ga").innerHTML = anatomy({...ai.parts, scheme: defang(ai.parts.scheme)});
  rc.querySelector(".gbar").innerHTML = `<span>Link ${g.i + 1} of ${ROUNDS}</span><span>Score <b>${g.score}</b></span><span>Streak <b>${g.streak}</b></span>`;
  rc.querySelector(".choices").outerHTML = `<div class="${right ? "legitimate" : "phishing"}">
    <p class="verdict">${right ? "Nice catch! +" + pts : "Missed it."}</p>
    <p class="real">${truth ? "This was a <b>phishing</b> link." : "This was a <b>real</b> site."}${ai ? ` The AI model alone said <b>${TITLES[ai.verdict]}</b> (${ai.score}/100) and ${aiRight ? "got it right" : "got it wrong"}.` : ""}</p></div>
    ${ai ? reasonList(ai.reasons.slice(0, 3)) : ""}
    <button class="next" id="nx">${g.i + 1 < ROUNDS ? "Next link" : "See results"}</button>`;
  $("nx").onclick = () => { g.i++; g.i < ROUNDS ? round() : finish(); };
}
function confetti() {
  const bits = ["🎉","⭐","🐱","🫧","✨","👩‍🦱","🐟","🐱"];
  for (let k = 0; k < 26; k++) {
    const e = document.createElement("span"); e.className = "confetti";
    e.textContent = bits[k % bits.length]; e.style.left = Math.random() * 100 + "vw";
    e.style.animationDelay = Math.random() * .4 + "s"; document.body.appendChild(e);
    setTimeout(() => e.remove(), 2200);
  }
}
function finish() {
  const rank = RANKS.find(r => g.score < r[0])[1];
  const line = g.you > g.ai ? "You beat the detector." : g.you < g.ai ? "The detector edged you out." : "A tie with the detector.";
  $("gbox").innerHTML = `<div class="card pop"><p class="gq">Final score ${g.score}</p><p class="rank">${rank}</p>
    <p>You got <b>${g.you}</b> of ${ROUNDS} right. The detector got <b>${g.ai}</b>. ${line}</p>
    <button class="next" id="again">Play again</button></div>`;
  $("again").onclick = start;
}
</script>
</body>
</html>
